<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<title>갓준자 관리자 계정 개설</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#36305c,#101324 70%);color:#f5f3ff;font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:18px}
main{width:min(100%,420px);padding:28px;border-radius:24px;border:1px solid #61557c;background:#191a30;box-shadow:0 14px 60px #0007}
h1{font-size:25px;margin:0 0 9px;color:#f6d68d}.sub{color:#c8bed9;font-size:14px;margin:0 0 23px}
label{display:block;margin:15px 0 6px;font-weight:650}input{width:100%;padding:14px;background:#101327;color:white;border:1px solid #61557c;border-radius:12px;font:inherit}input:focus{outline:2px solid #d7b26e}
button{width:100%;padding:15px;background:#e2bf83;color:#27213d;border:0;border-radius:12px;font-weight:800;font-size:16px;margin-top:22px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
small{display:block;color:#bbb0d0;font-size:12px;margin-top:8px}.message{min-height:26px;margin-top:17px;white-space:pre-wrap}.good{color:#a9ffc0}.bad{color:#ffb5c4}a{color:#f6d68d}
</style>
<script src="/admin-setup.js" defer></script>
</head>
<body>
<main>
<h1>👑 갓준자 관리자 개설</h1>
<p class="sub">운영자가 전달받은 1회용 개설 코드로 관리자 계정을 생성합니다. 게임마다 코드는 다릅니다. 기존 일반 회원 데이터는 변경하지 않습니다.</p>
<form id="claim">
<label for="username">관리자 아이디</label>
<input id="username" value="admin_junja" readonly autocomplete="off">
<label for="setupCode">1회용 관리자 개설 코드</label>
<input id="setupCode" name="setupCode" autocomplete="off" required spellcheck="false" autocapitalize="off">
<label for="password">새 관리자 비밀번호 (12자 이상)</label>
<input id="password" name="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
<small>다른 사이트에서 사용하지 않은 비밀번호로 정하세요. 코드는 한 번만 사용할 수 있습니다.</small>
<button id="submit" type="submit">관리자 계정 만들기</button>
</form>
<p id="message" class="message" role="status" aria-live="polite"></p>
<a href="/">게임으로 돌아가기</a>
</main>
</body>
</html>
