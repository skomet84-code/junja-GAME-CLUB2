<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>준자랜드 - 준자 에코</title>
<style>
:root{--ink:#f8fbff;--muted:#a8b5ce;--panel:rgba(12,18,39,.82);--line:rgba(255,255,255,.12);--cyan:#55e9ff;--pink:#ff55bd;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b19;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{display:block;width:100%;height:100%;background:#0b1228}
.hud{position:fixed;z-index:3;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(14px,2.4vw,21px);text-shadow:0 0 18px #5de9ff}.sub{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:3px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:8px 12px;border:1px solid var(--line);background:rgba(15,22,49,.75);border-radius:999px;font-size:12px;backdrop-filter:blur(10px)}.pill b{color:var(--gold);margin-left:4px}
.barbox{width:min(410px,65vw);margin-top:12px}.barline{height:9px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;border:1px solid rgba(255,255,255,.08)}.bar{height:100%;transition:width .15s;background:linear-gradient(90deg,#ff4c79,#ffce4c);box-shadow:0 0 16px #ff6f6f}.xp{height:100%;background:linear-gradient(90deg,#56e6ff,#936cff);box-shadow:0 0 16px #56e6ff}.barlabel{display:flex;justify-content:space-between;font-size:11px;color:#d9e1ef;margin:0 3px 4px}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.skills{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;max-width:65%}.skill{width:56px;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(145deg,rgba(37,51,91,.95),rgba(12,17,36,.95));color:white;display:grid;place-items:center;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.25)}.skill .icon{font-size:23px}.skill small{position:absolute;bottom:3px;font-size:9px;color:#d5def5}.skill.ready{border-color:var(--cyan);box-shadow:0 0 18px rgba(85,233,255,.28)}
.joy{width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.17);background:rgba(19,28,58,.62);position:relative;pointer-events:auto;box-shadow:inset 0 0 28px rgba(0,0,0,.25)}.nub{width:46px;height:46px;position:absolute;left:37px;top:37px;border-radius:50%;background:linear-gradient(145deg,#79f1ff,#5253ff);box-shadow:0 0 22px #4f80ff}
.banner{position:fixed;z-index:5;left:50%;top:17%;transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;padding:14px 26px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(10,16,39,.86);box-shadow:0 0 35px rgba(85,233,255,.2);font-size:clamp(16px,3vw,29px);font-weight:900;letter-spacing:.04em;transition:.3s}.banner.show{opacity:1;transform:translateX(-50%) scale(1)}
.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(3,5,14,.62);backdrop-filter:blur(8px);pointer-events:auto}.modal.open{display:grid}.card{width:min(620px,calc(100% - 28px));padding:24px;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:linear-gradient(145deg,rgba(26,36,74,.98),rgba(9,13,30,.98));box-shadow:0 20px 80px #000;pointer-events:auto}.card h1{margin:0 0 5px;font-size:clamp(24px,5vw,42px)}.card p{color:var(--muted);margin:0 0 18px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:142px;padding:15px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);text-align:left}.choice:hover{border-color:var(--cyan);background:rgba(85,233,255,.12)}.choice b{display:block;font-size:17px;margin:9px 0}.choice span{font-size:12px;color:#becbe1;line-height:1.45}.btn{margin-top:17px;border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(90deg,#5d64ff,#d44fff);color:white;font-weight:800;font-size:15px;touch-action:manipulation;pointer-events:auto}
@media(max-width:620px){.hud{padding:11px}.stats{gap:5px}.pill{padding:6px 8px;font-size:10px}.barbox{width:70vw}.joy{width:100px;height:100px}.nub{left:30px;top:30px}.skills{max-width:58%}.skill{width:48px;height:48px}.skill .icon{font-size:19px}.choices{grid-template-columns:1fr}.choice{min-height:88px}.choice span{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div><div class="top"><div><div class="brand">JUNJA LAND // JUNJA ECHO</div><div class="sub">SURVIVAL ARENA · CHAPTER 01</div></div><div class="stats"><div class="pill">웨이브 <b id="wave">1</b></div><div class="pill">콤보 <b id="combo">0</b></div><div class="pill">💰 <b id="gold">0</b></div></div></div>
 <div class="barbox"><div class="barlabel"><span>HP <b id="hpText">100 / 100</b></span><span>Lv.<b id="level">1</b> · <b id="xpText">0%</b></span></div><div class="barline"><div id="hp" class="bar" style="width:100%"></div></div><div class="barline" style="margin-top:5px"><div id="xp" class="xp" style="width:0%"></div></div></div></div>
 <div class="bottom"><div class="skills" id="skills"><div class="skill ready"><span class="icon">🌀</span><small>에코 블레이드</small></div></div><div class="joy" id="joy"><div class="nub" id="nub"></div></div></div>
</div>
<div class="banner" id="banner"></div>
<div class="modal" id="start"><div class="card"><h1>준자 에코</h1><p>끝없이 몰려오는 적을 뚫고 살아남아라. 움직이는 동안 스킬이 자동으로 발동된다.</p><button type="button" class="btn" id="startBtn" onclick="startGame(event)" ontouchend="startGame(event)">ARENA 입장</button></div></div>
<div class="modal" id="levelModal"><div class="card"><h1>에코 강화</h1><p>레벨업 보상 하나를 선택해 전투 스타일을 완성해라.</p><div class="choices" id="choices"></div></div></div>
<div class="modal" id="over"><div class="card"><h1 id="overTitle">전투 종료</h1><p id="overText"></p><button class="btn" id="retry">다시 도전</button></div></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');let W,H,DPR,run=false,last=0,t=0,wave=1,level=1,xp=0,maxXp=90,hp=100,maxHp=100,gold=0,combo=0,kills=0,spawn=0,shake=0,player,enemies=[],shots=[],parts=[],upgrades=[];let joy={x:0,y:0,active:false};
const skills={blade:{name:'에코 블레이드',icon:'🌀',lvl:1,cd:0},orbit:{name:'준자 위성',icon:'🟣',lvl:0,cd:0},nova:{name:'네온 폭발',icon:'💥',lvl:0,cd:0},chain:{name:'체인 번개',icon:'⚡',lvl:0,cd:0}};
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(DPR,0,0,DPR,0,0);if(player){player.x=Math.min(W-45,Math.max(45,player.x));player.y=Math.min(H-100,Math.max(75,player.y))}}addEventListener('resize',resize);resize();
function reset(){run=true;t=0;wave=1;level=1;xp=0;maxXp=90;hp=maxHp=100;gold=combo=kills=0;spawn=0;shake=0;enemies=[];shots=[];parts=[];upgrades=[];Object.values(skills).forEach(s=>{s.lvl=s.name==='에코 블레이드'?1:0;s.cd=0});player={x:W/2,y:H/2,r:18,spd:205,inv:0};document.getElementById('start').classList.remove('open');document.getElementById('over').classList.remove('open');updateHud();}
function say(v){const b=document.getElementById('banner');b.textContent=v;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),1200)}
function enemy(){let side=Math.floor(Math.random()*4),px=side===0?-28:side===1?W+28:Math.random()*W,py=side===2?-28:side===3?H+28:Math.random()*H;let elite=Math.random()<Math.min(.18,wave*.012);enemies.push({x:px,y:py,r:elite?22:14,hp:elite?55+wave*8:16+wave*3,max:elite?55+wave*8:16+wave*3,spd:elite?38:52+Math.random()*18+wave*1.3,elite,hit:0})}
function shot(a,b,damage,color){shots.push({x:a.x,y:a.y,vx:(b.x-a.x)/Math.hypot(b.x-a.x,b.y-a.y)*470,vy:(b.y-a.y)/Math.hypot(b.x-a.x,b.y-a.y)*470,r:5,damage,color,life:1})}
function nearest(){let best=null,bd=Infinity;for(const e of enemies){let d=(e.x-player.x)**2+(e.y-player.y)**2;if(d<bd){bd=d;best=e}}return best}
function attack(dt){const s=skills.blade;s.cd-=dt;if(s.cd<=0&&enemies.length){let e=nearest();shot(player,e,15+s.lvl*8,'#65f4ff');s.cd=Math.max(.22,.55-s.lvl*.04)}if(skills.nova.lvl){skills.nova.cd-=dt;if(skills.nova.cd<=0){let rad=85+skills.nova.lvl*12;for(const e of enemies)if(Math.hypot(e.x-player.x,e.y-player.y)<rad)e.hp-=28+skills.nova.lvl*15;burst(player.x,player.y,'#ff67c9',28);skills.nova.cd=3.5-skills.nova.lvl*.2}}if(skills.orbit.lvl&&Math.random()<dt*1.8){let e=nearest();if(e)shot(player,e,18+skills.orbit.lvl*10,'#ba77ff')}if(skills.chain.lvl){skills.chain.cd-=dt;if(skills.chain.cd<=0){let e=nearest();if(e){e.hp-=35+skills.chain.lvl*15;burst(e.x,e.y,'#ffe164',8)}skills.chain.cd=2.4}}}
function update(dt){if(!run)return;t+=dt;wave=1+Math.floor(t/25);spawn-=dt;if(spawn<=0){let n=1+Math.floor(wave/3);for(let i=0;i<n;i++)enemy();spawn=Math.max(.25,1.1-wave*.045)}player.inv=Math.max(0,player.inv-dt);let dx=joy.x,dy=joy.y;if(!joy.active){dx=(keys.d?1:0)-(keys.a?1:0);dy=(keys.s?1:0)-(keys.w?1:0)}let m=Math.hypot(dx,dy)||1;player.x=Math.min(W-30,Math.max(30,player.x+dx/m*player.spd*dt));player.y=Math.min(H-90,Math.max(70,player.y+dy/m*player.spd*dt));attack(dt);for(const e of enemies){let d=Math.hypot(player.x-e.x,player.y-e.y)||1;e.x+=(player.x-e.x)/d*e.spd*dt;e.y+=(player.y-e.y)/d*e.spd*dt;e.hit=Math.max(0,e.hit-dt);if(d<e.r+player.r&&player.inv<=0){hp-=e.elite?15:7;player.inv=.7;shake=8;burst(player.x,player.y,'#ff5679',9);if(hp<=0)return end()}}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(const e of enemies)if(s.life>0&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+s.r){e.hp-=s.damage;s.life=0;e.hit=.1;burst(s.x,s.y,s.color,3)}}shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){let e=enemies[i];enemies.splice(i,1);kills++;combo++;gold+=e.elite?35:5;gainXp(e.elite?32:12);burst(e.x,e.y,e.elite?'#ffd166':'#67dfff',e.elite?20:8)}for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.96;p.vy*=.96}parts=parts.filter(p=>p.life>0);updateHud()}
function gainXp(v){xp+=v;while(xp>=maxXp){xp-=maxXp;level++;maxXp=Math.round(maxXp*1.2);run=false;openLevel()}}
function openLevel(){const box=document.getElementById('choices');box.innerHTML='';let list=[['🌀','에코 블레이드','공격 속도와 피해가 증가합니다.','blade'],['💥','네온 폭발','주기적으로 주변을 폭발시킵니다.','nova'],['🟣','준자 위성','추가 투사체가 날아갑니다.','orbit'],['⚡','체인 번개','가까운 적에게 강력한 번개를 칩니다.','chain']].sort(()=>Math.random()-.5).slice(0,3);list.forEach(a=>{let b=document.createElement('button');b.className='choice';b.innerHTML=`<div style="font-size:27px">${a[0]}</div><b>${a[1]}</b><span>${a[2]}</span>`;b.onclick=()=>{skills[a[3]].lvl++;run=true;document.getElementById('levelModal').classList.remove('open');say(a[1]+' 강화!');renderSkills()};box.appendChild(b)});document.getElementById('levelModal').classList.add('open')}
function renderSkills(){let box=document.getElementById('skills');box.innerHTML='';Object.entries(skills).filter(([k,s])=>s.lvl).forEach(([k,s])=>{let d=document.createElement('div');d.className='skill ready';d.innerHTML=`<span class="icon">${s.icon}</span><small>${s.name} ${s.lvl}</small>`;box.appendChild(d)})}
function end(){run=false;document.getElementById('overTitle').textContent='전투 종료';document.getElementById('overText').textContent=`웨이브 ${wave} · 레벨 ${level} · 처치 ${kills}마리 · ${gold}골드`;document.getElementById('over').classList.add('open')}
function burst(px,py,col,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=30+Math.random()*140;parts.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.5,r:2+Math.random()*4,col})}}
function draw(){x.clearRect(0,0,W,H);let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;shake*=.88;x.save();x.translate(sx,sy);let g=x.createRadialGradient(W*.5,H*.45,30,W*.5,H*.45,Math.max(W,H)*.75);g.addColorStop(0,'#1d2753');g.addColorStop(1,'#080d20');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.globalAlpha=.25;x.strokeStyle='#6276b5';x.lineWidth=1;for(let i=-H;i<W+H;i+=52){x.beginPath();x.moveTo(i,0);x.lineTo(i+H,H);x.stroke();x.beginPath();x.moveTo(i,H);x.lineTo(i+H,0);x.stroke()}x.globalAlpha=1;for(const s of shots){x.shadowBlur=18;x.shadowColor=s.color;x.fillStyle=s.color;x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill()}for(const e of enemies){x.save();x.translate(e.x,e.y);x.shadowBlur=e.elite?26:13;x.shadowColor=e.elite?'#ff9a4b':'#58dfff';x.fillStyle=e.hit>0?'#fff':e.elite?'#ff8f69':'#704eff';x.beginPath();x.arc(0,0,e.r,0,7);x.fill();x.fillStyle='#10152c';x.beginPath();x.arc(-5,-2,3,0,7);x.arc(5,-2,3,0,7);x.fill();x.restore();let bw=e.r*2.3;x.fillStyle='rgba(0,0,0,.5)';x.fillRect(e.x-bw/2,e.y-e.r-9,bw,3);x.fillStyle=e.elite?'#ffcc56':'#69e5ff';x.fillRect(e.x-bw/2,e.y-e.r-9,bw*(e.hp/e.max),3)}if(player){x.save();x.translate(player.x,player.y);let r=27+Math.sin(t*3)*2;x.strokeStyle='rgba(85,233,255,.28)';x.lineWidth=3;x.beginPath();x.arc(0,0,r,0,7);x.stroke();if(skills.orbit.lvl){for(let i=0;i<skills.orbit.lvl;i++){let a=t*2+i*Math.PI*2/skills.orbit.lvl;x.fillStyle='#c47cff';x.shadowBlur=15;x.shadowColor='#c47cff';x.beginPath();x.arc(Math.cos(a)*38,Math.sin(a)*38,6,0,7);x.fill()}}x.shadowBlur=25;x.shadowColor='#5de9ff';x.fillStyle=player.inv>0?'#fff':'#54dfff';x.beginPath();x.arc(0,0,player.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#17254e';x.beginPath();x.arc(-6,-2,3,0,7);x.arc(6,-2,3,0,7);x.fill();x.restore()}for(const p of parts){x.globalAlpha=Math.max(0,p.life*1.5);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}x.globalAlpha=1;x.restore();requestAnimationFrame(loop)}
function loop(now){let dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw()}
function updateHud(){document.getElementById('wave').textContent=wave;document.getElementById('combo').textContent=combo;document.getElementById('gold').textContent=gold;document.getElementById('level').textContent=level;document.getElementById('hpText').textContent=Math.max(0,Math.ceil(hp))+' / '+maxHp;document.getElementById('xpText').textContent=Math.round(xp/maxXp*100)+'%';document.getElementById('hp').style.width=Math.max(0,hp/maxHp*100)+'%';document.getElementById('xp').style.width=xp/maxXp*100+'%'}
function startGame(e){if(e){e.preventDefault();e.stopPropagation()}if(run)return;reset();renderSkills()}
setTimeout(function(){if(!run&&document.getElementById('start').classList.contains('open'))startGame()},1200);
document.addEventListener('pointerup',function(e){if(document.getElementById('start').classList.contains('open')&&e.target.closest&&e.target.closest('#startBtn'))startGame(e)},true);
document.addEventListener('touchend',function(e){if(document.getElementById('start').classList.contains('open')&&e.target.closest&&e.target.closest('#startBtn'))startGame(e)},true);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '&&run){let q=nearest();if(q){q.hp-=100;burst(q.x,q.y,'#fff',20)}}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function pointer(e){let r=document.getElementById('joy').getBoundingClientRect(),p=e.touches?e.touches[0]:e,dx=p.clientX-(r.left+r.width/2),dy=p.clientY-(r.top+r.height/2),m=Math.min(1,Math.hypot(dx,dy)/(r.width*.38));joy.x=dx/(Math.hypot(dx,dy)||1)*m;joy.y=dy/(Math.hypot(dx,dy)||1)*m;joy.active=true;document.getElementById('nub').style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`}function stop(){joy.active=false;joy.x=joy.y=0;document.getElementById('nub').style.transform=''}const j=document.getElementById('joy');j.addEventListener('pointerdown',pointer);addEventListener('pointermove',e=>{if(joy.active)pointer(e)});addEventListener('pointerup',stop);document.getElementById('startBtn').onclick=()=>{reset();renderSkills()};document.getElementById('retry').onclick=()=>{reset();renderSkills()};reset();renderSkills();requestAnimationFrame(loop);
</script>
</body></html>
