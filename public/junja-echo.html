<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>준자랜드 - 준자 에코</title>
<style>
:root{--ink:#f8fbff;--muted:#a8b5ce;--panel:rgba(12,18,39,.82);--line:rgba(255,255,255,.12);--cyan:#55e9ff;--pink:#ff55bd;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b19;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#game{display:block;width:100%;height:100%;background:#0b1228}
.hud{position:fixed;z-index:3;inset:0;pointer-events:none;padding:16px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-weight:900;letter-spacing:.08em;font-size:clamp(14px,2.4vw,21px);text-shadow:0 0 18px #5de9ff}.sub{font-size:11px;color:var(--muted);letter-spacing:.14em;margin-top:3px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:8px 12px;border:1px solid var(--line);background:rgba(15,22,49,.75);border-radius:999px;font-size:12px;backdrop-filter:blur(10px)}.pill b{color:var(--gold);margin-left:4px}
.barbox{width:min(410px,65vw);margin-top:12px}.barline{height:9px;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden;border:1px solid rgba(255,255,255,.08)}.bar{height:100%;transition:width .15s;background:linear-gradient(90deg,#ff4c79,#ffce4c);box-shadow:0 0 16px #ff6f6f}.xp{height:100%;background:linear-gradient(90deg,#56e6ff,#936cff);box-shadow:0 0 16px #56e6ff}.barlabel{display:flex;justify-content:space-between;font-size:11px;color:#d9e1ef;margin:0 3px 4px}
.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.skills{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;max-width:65%}.skill{width:56px;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:linear-gradient(145deg,rgba(37,51,91,.95),rgba(12,17,36,.95));color:white;display:grid;place-items:center;position:relative;box-shadow:0 8px 22px rgba(0,0,0,.25)}.skill .icon{font-size:23px}.skill small{position:absolute;bottom:3px;font-size:9px;color:#d5def5}.skill.ready{border-color:var(--cyan);box-shadow:0 0 18px rgba(85,233,255,.28)}
.joy{width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.17);background:rgba(19,28,58,.62);position:relative;pointer-events:auto;box-shadow:inset 0 0 28px rgba(0,0,0,.25)}.nub{width:46px;height:46px;position:absolute;left:37px;top:37px;border-radius:50%;background:linear-gradient(145deg,#79f1ff,#5253ff);box-shadow:0 0 22px #4f80ff}
.banner{position:fixed;z-index:5;left:50%;top:17%;transform:translateX(-50%) scale(.85);opacity:0;pointer-events:none;padding:14px 26px;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:rgba(10,16,39,.86);box-shadow:0 0 35px rgba(85,233,255,.2);font-size:clamp(16px,3vw,29px);font-weight:900;letter-spacing:.04em;transition:.3s}.banner.show{opacity:1;transform:translateX(-50%) scale(1)}
.modal{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(3,5,14,.62);backdrop-filter:blur(8px);pointer-events:auto}.modal.open{display:grid}.card{width:min(620px,calc(100% - 28px));padding:24px;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:linear-gradient(145deg,rgba(26,36,74,.98),rgba(9,13,30,.98));box-shadow:0 20px 80px #000;pointer-events:auto}.card h1{margin:0 0 5px;font-size:clamp(24px,5vw,42px)}.card p{color:var(--muted);margin:0 0 18px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{min-height:142px;padding:15px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);text-align:left}.choice:hover{border-color:var(--cyan);background:rgba(85,233,255,.12)}.choice b{display:block;font-size:17px;margin:9px 0}.choice span{font-size:12px;color:#becbe1;line-height:1.45}.btn{margin-top:17px;border:0;border-radius:12px;padding:12px 18px;background:linear-gradient(90deg,#5d64ff,#d44fff);color:white;font-weight:800;font-size:15px;touch-action:manipulation;pointer-events:auto}
@media(max-width:620px){.hud{padding:11px}.stats{gap:5px}.pill{padding:6px 8px;font-size:10px}.barbox{width:70vw}.joy{width:100px;height:100px}.nub{left:30px;top:30px}.skills{max-width:58%}.skill{width:48px;height:48px}.skill .icon{font-size:19px}.choices{grid-template-columns:1fr}.choice{min-height:88px}.choice span{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud">
 <div><div class="top"><div><div class="brand">JUNJA LAND // JUNJA ECHO</div><div class="sub">SURVIVAL ARENA · CHAPTER 01</div></div><div class="stats"><div class="pill">웨이브 <b id="wave">1</b></div><div class="pill">콤보 <b id="combo">0</b></div><div class="pill">💰 <b id="gold">0</b></div><div class="pill">기록 Lv.<b id="metaLevel">1</b></div><div class="pill">최고 <b id="bestWave">0</b>W</div></div></div>
 <div class="barbox"><div class="barlabel"><span>HP <b id="hpText">100 / 100</b></span><span>Lv.<b id="level">1</b> · <b id="xpText">0%</b></span></div><div class="barline"><div id="hp" class="bar" style="width:100%"></div></div><div class="barline" style="margin-top:5px"><div id="xp" class="xp" style="width:0%"></div></div></div></div>
 <div class="bottom"><div class="skills" id="skills"><div class="skill ready"><span class="icon">🌀</span><small>에코 블레이드</small></div></div><div class="joy" id="joy"><div class="nub" id="nub"></div></div></div>
</div>
<div class="banner" id="banner"></div>
<div class="modal" id="start"><div class="card"><h1>준자 에코</h1><p>끝없이 몰려오는 적을 뚫고 살아남아라. 움직이는 동안 스킬이 자동으로 발동된다.</p><button type="button" class="btn" id="startBtn" onclick="startGame(event)" ontouchend="startGame(event)">ARENA 입장</button></div></div>
<div class="modal" id="levelModal"><div class="card"><h1>에코 강화</h1><p>레벨업 보상 하나를 선택해 전투 스타일을 완성해라.</p><div class="choices" id="choices"></div></div></div>
<div class="modal" id="over"><div class="card"><h1 id="overTitle">전투 종료</h1><p id="overText"></p><button class="btn" id="retry">다시 도전</button></div></div>
<script src="/junja-echo.js?v=20261005-5"></script>
</body></html>
