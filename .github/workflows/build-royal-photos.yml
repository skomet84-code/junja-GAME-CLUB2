name: Build JUNJA Royal Licensed Photo Assets
on:
  push:
    branches:
      - feat/final-royal-local-media-20261103
    paths:
      - scripts/build_royal_photos.py
      - .github/workflows/build-royal-photos.yml
      - royal-economy.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-real-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout working source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging dependencies
        run: python -m pip install --quiet --disable-pip-version-check requests Pillow
      - name: Dump certified game shop catalog
        run: node -e "const fs=require('fs');const {ROYAL_ITEMS}=require('./royal-economy');fs.writeFileSync('/tmp/junja-royal-items.json',JSON.stringify(ROYAL_ITEMS))"
      - name: Download CC-licensed and grade real-model photos
        run: python -u scripts/build_royal_photos.py --items /tmp/junja-royal-items.json --min-items 12
      - name: Record all source attributions and cache images
        run: |
          git config user.name "junja-royal-photo-bot"
          git config user.email "junja-royal-photo-bot@users.noreply.github.com"
          git add public/art/royal/photos public/royal-photo-credits.js
          if ! git diff --cached --quiet; then
            git commit -m "art(royal): cache verified real-model licensed photographs and Commons credits"
            git push origin "HEAD:feat/final-royal-local-media-20261103"
          else
            echo "All photo assets already verified and unchanged."
          fi
